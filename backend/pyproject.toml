[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jaxon-os"
version = "0.1.0"
description = "JAXON OS - modular AI business operating system (backend, agents, skills, workers)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "anthropic>=2.6",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "playwright>=1.45",
]

[project.scripts]
jaxon-worker = "jaxon.workers.run_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["jaxon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs real PostgreSQL+pgvector and Redis (DATABASE_URL / REDIS_URL)",
  "live: calls real external APIs (needs ANTHROPIC_API_KEY); never runs in CI by default",
  "browser: needs a Chromium binary usable by Playwright",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
